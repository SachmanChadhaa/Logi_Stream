# LiteLLM proxy configuration for LogiStream.
#
# Why this exists (and why it is not just for the slide):
#
#   1. INTERNAL NAMES. The orchestrator asks for "logistream-evaluator" and
#      "logistream-tutor". It never names a vendor or a model. Swapping provider
#      is a change to this file and nothing else -- which is exactly the seam
#      CLAUDE.md section 3 promised when it deferred LiteLLM.
#
#   2. TWO KINDS OF FAILOVER. OpenRouter's free tier throws 429 constantly, and
#      a rate limit during the Thursday demo is unrecoverable by hand.
#        * Round-robin across THREE API keys. Free-tier limits are per key, so
#          three keys means roughly three times the headroom and a limit on one
#          key costs at most one turn.
#        * A model fallback underneath. If qwen is limited for every key, the
#          request still gets answered by nemotron instead of failing.
#      Keys alone do not cover a model-wide limit; a fallback alone does not
#      cover per-key limits. Both are needed.
#
# Model choice is evidence-based, not a guess. From
# `uv run python orchestrator/scripts/model_bakeoff.py` on 2026-09-21, scored
# against the real F1/F3/F3b/F6 fixtures:
#
#   qwen/qwen3.8-27b:free                     4/4 verdicts, 4/4 valid JSON, ~18s
#   nvidia/nemotron-3-super-120b-a12b:free    3/4 verdicts, 3/4 valid JSON, ~8s
#   z-ai/glm-5.2:free                         rate-limited out
#   google/gemma-4-31b-it:free                rate-limited out
#
# Note the slug named in the original .env, google/gemini-2.0-flash-exp:free,
# no longer exists on OpenRouter at all (CLAUDE.md trap 12, exactly as warned).

model_list:
  # 2026-10-23: the free OpenRouter models above are gone (qwen3.8-27b:free
  # "unavailable for free", nemotron backup 404). On the owner's decision the
  # PRIMARY deployment is now the local qwen3 on this laptop's Ollama: free,
  # offline, no rate limits. It shares the 8 GB GPU with the vision model, so
  # Ollama swaps them; expect slow first tokens after a swap. host.docker.internal
  # is how this container reaches Ollama on the host.
  # OpenRouter stays as the backup group, so restoring a working cloud model is
  # a one-line change there.
  # 2026-10-24: qwen3-14b -> qwen3-8b (ollama/Modelfile.logistream-qwen3-8b).
  # The 14B needs ~10.8 GB, so on the 8 GB card it was split GPU+CPU: ~5 tok/s
  # on Vulkan and a crash (0xc0000409) on CUDA. The 8B fits in VRAM (6.2 GB):
  # ~23 tok/s. Same prompts, Vulkan, 14B -> 8B: screen-problem analysis
  # 288 s -> 145 s, tutor reply 106 s -> 21 s; outputs equally correct on that check.
  # Rebuild locally: ollama pull qwen3:8b && ollama create logistream-qwen3-8b
  #   -f ollama/Modelfile.logistream-qwen3-8b

  # ---------------------------------------------------------------- evaluator
  - model_name: logistream-evaluator
    litellm_params:
      model: ollama_chat/logistream-qwen3-8b
      api_base: os.environ/OLLAMA_API_BASE_FOR_LITELLM
      temperature: 0

  - model_name: logistream-evaluator-backup
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY_1
      api_base: https://openrouter.ai/api/v1
      temperature: 0

  # -------------------------------------------------------------------- tutor
  # Every output is machine-verified downstream, so a weaker fallback is safe.
  - model_name: logistream-tutor
    litellm_params:
      model: ollama_chat/logistream-qwen3-8b
      api_base: os.environ/OLLAMA_API_BASE_FOR_LITELLM

  - model_name: logistream-tutor-backup
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY_1
      api_base: https://openrouter.ai/api/v1

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1      # a local model that failed once will not succeed by retrying fast
  retry_after: 5
  # A free-tier turn has been measured past 90s. A shorter timeout here would
  # cut off a slow but perfectly good answer (CLAUDE.md trap 8).
  timeout: 170
  allowed_fails: 3
  cooldown_time: 30
  fallbacks:
    - logistream-evaluator: ["logistream-evaluator-backup"]
    - logistream-tutor: ["logistream-tutor-backup"]

litellm_settings:
  drop_params: true          # free models reject params they do not implement
  request_timeout: 170
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
