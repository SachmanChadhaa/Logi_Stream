server:
  port: 8080
  # /internal/execute runs arbitrary student code with this service's privileges
  # (LocalPythonSandbox is not a security sandbox). Never expose this port. Set
  # DOMAIN_BIND=127.0.0.1 to lock it down -- see .env.example for why the URLs
  # must then say 127.0.0.1 too.
  address: ${DOMAIN_BIND:0.0.0.0}

spring:
  application:
    name: logistream-domain
  sql:
    init:
      # idempotent ALTERs for bring-your-own-problem; see the file's header
      mode: always
      schema-locations: classpath:schema-byop.sql
      continue-on-error: false
  datasource:
    # Java does not read .env; the start scripts do `set -a; source .env; set +a`.
    url: ${DATABASE_URL_JDBC:jdbc:postgresql://localhost:5432/logistream}
    username: ${POSTGRES_USER:logistream}
    password: ${POSTGRES_PASSWORD:logistream}
    hikari:
      maximum-pool-size: 5

logistream:
  internal-token: ${INTERNAL_TOKEN:dev-internal-token-change-me}
  executor:
    # LOCAL runs student python in a subprocess on this host (default, free,
    # needs no network). JUDGE0 swaps in the hosted Judge0 CE client instead.
    # Both speak Judge0 status ids, so the section 8 bucket table is identical.
    mode: ${EXECUTOR_MODE:LOCAL}
    python: ${EXECUTOR_PYTHON:python}
  judge0:
    url: ${JUDGE0_URL:https://judge0-ce.p.rapidapi.com}
    rapidapi-key: ${JUDGE0_RAPIDAPI_KEY:}
    rapidapi-host: ${JUDGE0_RAPIDAPI_HOST:judge0-ce.p.rapidapi.com}
    python-language-id: ${JUDGE0_PYTHON_LANGUAGE_ID:71}
    poll-interval-ms: ${JUDGE0_POLL_INTERVAL_MS:1000}
    max-polls: ${JUDGE0_MAX_POLLS:15}

logging:
  level:
    com.logistream: INFO
  pattern:
    # every log line carries the trace id (CLAUDE.md section 1.7)
    # timestamps are UTC on purpose - see the comment in DomainApplication
    console: "%d{HH:mm:ss.SSS'Z'} %-5level [trace=%X{traceId:-none}] %logger{25} - %msg%n"
