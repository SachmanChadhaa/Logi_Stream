services:
  postgres:
    image: postgres:16
    container_name: logistream-postgres
    environment:
      POSTGRES_DB: logistream
      POSTGRES_USER: logistream
      POSTGRES_PASSWORD: logistream
    ports:
      - "5432:5432"
    volumes:
      - logistream-pgdata:/var/lib/postgresql/data
      # runs only on an empty volume; `docker compose down -v` re-runs it (CLAUDE.md trap 10)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistream -d logistream"]
      interval: 3s
      timeout: 5s
      retries: 20

  # LiteLLM proxy: the orchestrator's only LLM endpoint.
  #
  # It gives us internal model names decoupled from the provider, plus two kinds
  # of resilience against OpenRouter's free tier: round-robin across three API
  # keys (so a per-key rate limit only costs one turn) and a model fallback (so a
  # limit on the model itself still answers). A 429 on stage is unrecoverable.
  # See litellm_config.yaml for the routing and the bake-off that chose the models.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: logistream-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # one key per line: YAML list items cannot share a line, and merging two
      # onto one silently produced a single malformed entry rather than an error
      - OPENROUTER_API_KEY_1=${OPENROUTER_API_KEY_1:?set OPENROUTER_API_KEY_1 in .env}
      - OPENROUTER_API_KEY_2=${OPENROUTER_API_KEY_2:-${OPENROUTER_API_KEY_1}}
      - OPENROUTER_API_KEY_3=${OPENROUTER_API_KEY_3:-${OPENROUTER_API_KEY_1}}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-logistream-dev}
      # local Ollama on the host (primary model since 2026-10-23, see litellm_config.yaml)
      - OLLAMA_API_BASE_FOR_LITELLM=${OLLAMA_API_BASE_FOR_LITELLM:-http://host.docker.internal:11434}
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    healthcheck:
      # /health/liveliness needs no auth, unlike /health
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  logistream-pgdata:
