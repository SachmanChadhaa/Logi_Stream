[package]
name = "logistream-intel"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Advisory diagnostics sidecar: temporal GRU + XGBoost-style booster (synthetic-trained v0)"

[lib]
name = "intel"
path = "src/lib.rs"

[[bin]]
name = "intel-serve"
path = "src/bin/serve.rs"

[[bin]]
name = "intel-train"
path = "src/bin/train.rs"

[dependencies]
burn = { version = "0.18", default-features = false, features = ["std", "ndarray", "autodiff"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
